<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Peerora">
  <defs>
    <!-- Same brand gradient as .brand-mark: primary #4338ca to accent #0d9488 at 135 degrees -->
    <linearGradient id="peerora-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#peerora-gradient)"/>
  <!-- Letter "P" drawn as a path, so it renders the same without any font -->
  <path d="M23 49V15h11.5a10.5 10.5 0 0 1 0 21H23" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
